[package]
name = "scanner-sweep"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
crossterm = "0.29"
hex = "0.4"
hmac = "0.12"
pcap-file = "2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
sc2_core = { package = "superiority-core", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSURL"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
