[package]
name = "gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "BNCS compatibility gateway backed by Superiority's SC2 client"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3"
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
superiority-core = { path = "../core" }
thiserror = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
wry = "=0.56.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
wry = "=0.56.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
