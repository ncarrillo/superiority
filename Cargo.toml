[workspace]
members = [
    "core",
    "stimpak",
    "stimpak/auth-window",
    "ui",
    "app",
    "updater",
    "live-app",
    "bsn-derive",
    "gateway",
    "scanner-sweep",
    "tools/bsn-schema-generator",
    "tools/extract-bsn-metadata",
]
resolver = "3"

[workspace.dependencies]
gpui = { git = "https://github.com/ncarrillo/zed", rev = "ab1ddf343020437169c4d581e6f26724c3aff3a9", default-features = false }
gpui_platform = { git = "https://github.com/ncarrillo/zed", rev = "ab1ddf343020437169c4d581e6f26724c3aff3a9" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package.superiority-live-app]
opt-level = "s"

# fixme: stop runtime shader compilation on windows once we can use wine for fxc.exe invocations
[profile.release.package.gpui_windows]
debug-assertions = true

[patch.crates-io]
wry = { git = "https://github.com/ncarrillo/wry", rev = "0ac69b98c08a98db9db600fac761c95394c98cae" }
