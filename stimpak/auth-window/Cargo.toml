[package]
name = "stimpak-auth-window"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "stimpak-auth-window"
path = "src/main.rs"

[dependencies]
tao = { version = "0.36", default-features = false, features = ["rwh_06"] }
url = "2"
wry = { version = "=0.56.0", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
