name: Deploy SC2Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sc2docs.yml
      - protocol-reference/**

permissions:
  contents: read
  deployments: write

concurrency:
  group: sc2docs-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: protocol-reference/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: protocol-reference
      - name: Check
        run: npm run check
        working-directory: protocol-reference
      - name: Build
        run: npm run build
        working-directory: protocol-reference
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: protocol-reference
          command: pages deploy dist --project-name=superiority-sc2docs --branch=main
